<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101b1a" />
    <title>Noelle's Meadow</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" aria-label="Prairie de Noelle"></canvas>
      <div id="speech-bubbles" class="speech-bubbles" aria-live="polite"></div>

      <header class="hud">
        <div class="brand">
          <span class="brand-mark">N</span>
          <div>
            <p class="eyebrow">NOELLE'S MEADOW</p>
            <h1>La prairie</h1>
          </div>
          <button id="character-switch" class="character-switch" type="button" aria-label="Changer de personnage" title="Changer de personnage">Noelle <span aria-hidden="true">&#8644;</span></button>
        </div>
        <div class="online-status" id="status" data-state="solo">
          <span class="status-dot"></span>
          <span id="status-text">Mode solo</span>
        </div>
      </header>

      <section class="room-panel" aria-label="Salon multijoueur">
        <label for="room">Salon</label>
        <div class="room-controls">
          <input id="room" maxlength="18" value="prairie" autocomplete="off" spellcheck="false" />
          <button id="connect" type="button">Rejoindre</button>
        </div>
        <p id="room-help">Partage ce nom pour apparaître dans la même prairie.</p>
      </section>

      <section class="chat-panel" aria-label="Tchat de la prairie">
        <div class="chat-heading">
          <span>Tchat</span>
          <span class="chat-live"><span></span> direct</span>
        </div>
        <div id="chat-messages" class="chat-messages" aria-live="polite" aria-label="Messages du tchat">
          <p class="chat-empty" id="chat-empty">Les messages apparaîtront ici.</p>
        </div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" maxlength="180" autocomplete="off" placeholder="Écrire un message..." aria-label="Message" />
          <button type="submit" aria-label="Envoyer le message">Envoyer</button>
        </form>
      </section>

      <div class="hint"><span class="key">WASD</span> ou joystick pour se déplacer</div>
      <div id="players" class="players" aria-live="polite"></div>

      <div id="joystick" class="joystick" aria-label="Joystick de déplacement">
        <div class="joystick-ring"><div id="stick" class="joystick-stick"></div></div>
      </div>
    </main>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="game.js"></script>
  </body>
</html>
