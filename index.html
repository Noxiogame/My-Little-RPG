<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101b1a" />
    <title>Noelle's Meadow</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" aria-label="Prairie de Noelle"></canvas>
      <div id="speech-bubbles" class="speech-bubbles" aria-live="polite"></div>
      <button id="egg-reward" class="egg-reward" type="button" aria-label="Ouvrir l'oeuf de récompense" title="Oeuf de récompense">
        <img src="Tilesets/pipis.png" alt="Oeuf de récompense" />
      </button>
      <div id="egg-cooldown" class="egg-cooldown" aria-live="polite">Disponible</div>
      <div class="coin-wallet" aria-live="polite" title="Pièces gagnées avec les Pipis">
        <span class="coin-icon">¢</span>
        <span id="coin-amount">0</span>
      </div>
      <section id="egg-modal" class="egg-modal" aria-label="Oeuf de récompense" hidden>
        <div class="egg-modal-backdrop"></div>
        <div class="egg-card" role="dialog" aria-modal="true" aria-labelledby="egg-title">
          <button id="egg-close" class="egg-close" type="button" aria-label="Fermer">×</button>
          <p class="egg-label">Récompense mystérieuse</p>
          <h2 id="egg-title">L'oeuf de Pipis</h2>
          <div class="egg-stage">
            <img id="egg-image" class="egg-image" src="Tilesets/pipis.png" alt="Oeuf en cours de casse, cliquer pour frapper" role="button" tabindex="0" />
            <img id="egg-shard" class="egg-shard" alt="Fragment de coquille" hidden />
          </div>
          <p id="egg-progress" class="egg-progress">0 / 12 frappes</p>
          <p id="egg-result" class="egg-result" aria-live="polite"></p>
        </div>
      </section>
      <section id="skin-modal" class="skin-modal" aria-label="Bibliothèque de skins" hidden>
        <div class="skin-modal-backdrop"></div>
        <div class="skin-card" role="dialog" aria-modal="true" aria-labelledby="skin-title">
          <button id="skin-close" class="egg-close" type="button" aria-label="Fermer">×</button>
          <p class="egg-label">Collection personnelle</p>
          <h2 id="skin-title">Bibliothèque de skins</h2>
          <p class="skin-intro">Achète puis équipe ton personnage préféré.</p>
          <div id="skin-list" class="skin-list"></div>
          <p id="skin-result" class="skin-result" aria-live="polite"></p>
        </div>
      </section>

      <header class="hud">
        <div class="brand">
          <span class="brand-mark">N</span>
          <div>
            <p class="eyebrow">NOELLE'S MEADOW</p>
            <h1>La prairie</h1>
          </div>
          <button id="character-switch" class="character-switch" type="button" aria-label="Changer de personnage" title="Changer de personnage">Noelle <span aria-hidden="true">&#8644;</span></button>
        </div>
        <div class="online-status" id="status" data-state="solo">
          <span class="status-dot"></span>
          <span id="status-text">Mode solo</span>
        </div>
      </header>

      <section class="chat-panel" aria-label="Tchat de la prairie">
        <div class="chat-heading">
          <span>Tchat</span>
          <span class="chat-live"><span></span> direct</span>
        </div>
        <div id="chat-messages" class="chat-messages" aria-live="polite" aria-label="Messages du tchat">
          <p class="chat-empty" id="chat-empty">Les messages apparaîtront ici.</p>
        </div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" maxlength="180" autocomplete="off" placeholder="Écrire un message..." aria-label="Message" />
          <button type="submit" aria-label="Envoyer le message">Envoyer</button>
        </form>
      </section>

      <div class="hint"><span class="key">WASD</span> ou joystick pour se déplacer</div>
      <div id="players" class="players" aria-live="polite"></div>

      <div id="joystick" class="joystick" aria-label="Joystick de déplacement">
        <div class="joystick-ring"><div id="stick" class="joystick-stick"></div></div>
      </div>
    </main>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="game.js"></script>
  </body>
</html>
